name: Build desktop installers

# Push a version tag (e.g. v0.1.0) to build macOS, Windows and Linux installers
# and publish them to a GitHub Release. Also runnable on demand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release and upload installers

jobs:
  build:
    strategy:
      fail-fast: false
      # Each macOS arch gets its OWN runner. Building arm64 and x64 DMGs on one
      # runner makes the second 'hdiutil detach' fail on the shared volume name.
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --arm64
          - os: macos-latest
            args: --mac dmg --x64
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stop Spotlight (prevents flaky DMG 'hdiutil detach')
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Bundle app
        working-directory: desktop
        run: npm run build

      - name: Build & publish installer
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
