<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TABOOST Poster</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#262a36; --text:#e8eaf0; --muted:#8b91a3; --accent:#00a8cc; --ok:#2ecc71; --bad:#ff5c5c; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:960px; margin:0 auto; padding:32px 16px 64px }
  h1 { margin:0 0 4px; font-size:26px } .sub { color:var(--muted); margin:0 0 28px }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:28px 0 12px }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px }
  .card .name { font-weight:600; font-size:17px } .card .st { color:var(--muted); font-size:13px; margin:4px 0 12px }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--muted) }
  .dot.ok { background:var(--ok) } .dot.bad { background:var(--bad) }
  button { background:var(--accent); color:#001; border:0; border-radius:8px; padding:9px 16px; font-weight:600; cursor:pointer; font-size:14px }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line) }
  button:disabled { opacity:.5; cursor:default }
  form.post { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:grid; gap:14px }
  textarea, input[type=file] { width:100%; background:#0f1117; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit }
  textarea { min-height:110px; resize:vertical }
  .row { display:flex; flex-wrap:wrap; gap:16px; align-items:center }
  label.chk { display:flex; gap:6px; align-items:center; cursor:pointer }
  pre.log { background:#0a0c12; border:1px solid var(--line); border-radius:12px; padding:14px; min-height:80px; white-space:pre-wrap; font-size:13px; color:#cfd3dd; max-height:360px; overflow:auto }
  table { width:100%; border-collapse:collapse; font-size:13px } td, th { padding:8px 6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top } th { color:var(--muted); font-weight:500 }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; background:#243; color:var(--ok) } .pill.err { background:#3a1f1f; color:var(--bad) } .pill.dry { background:#2a2f3d; color:var(--muted) }
  .warn { color:#ffb454; font-size:13px }
  .beta { font-size:11px; background:#3a2f1f; color:#ffb454; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:middle }
</style>
</head>
<body>
<main>
  <h1>TABOOST Poster</h1>
  <p class="sub">Your own Chrome, your own logins. One click, every platform.</p>

  <h2>Accounts</h2>
  <div class="cards" id="cards"><div class="card">Checking Chrome…</div></div>

  <h2>New post — drop in as many clips as you want</h2>
  <form class="post" id="form">
    <input type="file" name="videos" accept="video/mp4,video/quicktime,video/*" multiple required>
    <div id="files"></div>
    <textarea name="caption" placeholder="Shared caption for every clip. (YouTube: first line becomes the title.) Add a per-clip caption below to override one."></textarea>
    <div class="row" id="targets"></div>
    <div class="row">
      <label class="chk"><input type="checkbox" name="live"> <b>Publish for real</b> <span class="warn">(unchecked = dry run, fills everything but never clicks Post)</span></label>
      <label class="chk">Space live posts <input type="number" name="space" value="60" min="10" max="900" style="width:60px"> s apart</label>
    </div>
    <div class="row"><button type="submit" id="go">Post all</button><span id="hint" class="warn"></span></div>
  </form>

  <h2>Progress</h2>
  <div id="grid"><span class="sub">No batch running.</span></div>

  <h2>Activity</h2>
  <pre class="log" id="log">Idle.</pre>

  <h2>History</h2>
  <table><thead><tr><th>When</th><th>Platform</th><th>Caption</th><th>Result</th></tr></thead><tbody id="hist"></tbody></table>
</main>
<script>
const $ = (s) => document.querySelector(s);
let platforms = {};
async function loadStatus() {
  try {
    platforms = await (await fetch("/api/status")).json();
    $("#cards").innerHTML = Object.entries(platforms).map(([id, p]) => `
      <div class="card">
        <div class="name"><span class="dot ${p.loggedIn ? "ok" : "bad"}"></span>${p.label}${p.verified ? "" : ' <span class="beta">unverified</span>'}</div>
        <div class="st">${p.loggedIn ? "Connected (logged in)" : "Not logged in"}</div>
        <button class="${p.loggedIn ? "ghost" : ""}" onclick="connect('${id}')">${p.loggedIn ? "Open login page" : "Connect"}</button>
      </div>`).join("");
    $("#targets").innerHTML = Object.entries(platforms).map(([id, p]) =>
      `<label class="chk"><input type="checkbox" name="platforms" value="${id}" ${p.loggedIn ? "checked" : "disabled"}> ${p.label}${p.loggedIn ? (p.verified ? "" : " · unverified") : " (connect first)"}</label>`).join("");
  } catch (e) { $("#cards").innerHTML = `<div class="card">Could not reach Chrome: ${e.message}</div>`; }
}
async function connect(id) {
  $("#log").textContent = `Opening ${platforms[id].label} login in the tool's Chrome window. Log in there; this page refreshes by itself.`;
  await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ platform: id }) });
  const t = setInterval(async () => { await loadStatus(); if (platforms[id].loggedIn) { clearInterval(t); $("#log").textContent = `${platforms[id].label} connected.`; } }, 4000);
}
async function loadHistory() {
  const rows = await (await fetch("/api/history")).json();
  $("#hist").innerHTML = rows.map(r => `<tr><td>${r.posted_at}</td><td>${r.platform}</td><td>${(r.caption || "").slice(0, 60)}</td><td><span class="pill ${r.status.startsWith("error") ? "err" : r.status === "posted" ? "" : "dry"}">${r.status.slice(0, 90)}</span></td></tr>`).join("");
}
// List the selected clips, each with an optional per-clip caption (caption0, caption1, …).
$("input[name=videos]").addEventListener("change", (e) => {
  const files = [...e.target.files];
  $("#files").innerHTML = files.length
    ? files.map((f, i) => `<div class="row"><span style="min-width:170px">🎬 ${f.name}</span><input name="caption${i}" placeholder="caption for this clip (optional)" style="flex:1"></div>`).join("")
    : "";
  $("#go").textContent = files.length > 1 ? `Post all ${files.length}` : "Post";
});

function cell(st) {
  return st === "done" ? '<span class="pill">✓</span>'
    : st === "error" ? '<span class="pill err">✖</span>'
    : st === "posting" ? '<span class="pill dry">…</span>'
    : '<span class="pill dry">·</span>';
}
function renderGrid(items) {
  const vids = [...new Set(items.map(i => i.video))];
  const plats = [...new Set(items.map(i => i.platform))];
  let html = '<table><thead><tr><th>Clip</th>' + plats.map(p => `<th>${p}</th>`).join("") + '</tr></thead><tbody>';
  for (const v of vids) {
    html += `<tr><td>${v.split("/").pop()}</td>` + plats.map(p => {
      const it = items.find(i => i.video === v && i.platform === p);
      return `<td>${it ? cell(it.status) : ""} ${it && it.note ? '<span class="warn">' + it.note.slice(0, 44) + '</span>' : ""}</td>`;
    }).join("") + "</tr>";
  }
  return html + "</tbody></table>";
}

$("#form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  const vids = fd.getAll("videos").filter(f => f && f.size > 0);
  if (!vids.length) { $("#hint").textContent = "Pick at least one video."; return; }
  if (!fd.getAll("platforms").length) { $("#hint").textContent = "Pick at least one connected platform."; return; }
  $("#go").disabled = true; $("#hint").textContent = "";
  $("#log").textContent = `Uploading ${vids.length} clip(s)…`; $("#grid").innerHTML = "";
  const r = await (await fetch("/api/batch", { method: "POST", body: fd })).json();
  if (r.error) { $("#log").textContent = "Error: " + r.error; $("#go").disabled = false; return; }
  const poll = setInterval(async () => {
    const j = await (await fetch("/api/batches/" + r.id)).json();
    $("#log").textContent = j.log.join("\n");
    if (j.items) $("#grid").innerHTML = renderGrid(j.items);
    if (j.done) { clearInterval(poll); $("#go").disabled = false; loadHistory(); }
  }, 1500);
});
loadStatus(); loadHistory();
</script>
</body>
</html>
